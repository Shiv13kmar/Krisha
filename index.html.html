<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Propose Day Kissa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to bottom right, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            text-align: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.35);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2em;
            color: #ffe6ec;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .ring {
            font-size: 4em;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .question {
            margin-top: 25px;
            font-size: 1.6em;
            font-weight: bold;
            color: #fff5f8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Happy Propose Day 💍</h1>
        <h2>My Dear Kissa</h2>

        <p>
            From the moment you came into my life,<br>
            everything started feeling more beautiful.
        </p>

        <p>
            I don’t want a perfect story,<br>
            I just want *you* in every chapter of my life ❤️
        </p>

        <div class="question">
            Will you be mine forever?
        </div>

        <div class="ring">💍</div>
    </div>
</body>
</html>
